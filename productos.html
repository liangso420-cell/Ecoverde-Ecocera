<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecocera — Catálogo</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Raleway:wght@300;400;500&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="productos.css">
</head>
<body>

  <!-- ENCABEZADO -->
  <header>
    <h1 class="marca">Ecocera</h1>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="productos.html" class="activo">Catálogo</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
    <div class="divisor"></div>
  </header>

  <div class="page-wrapper">

    <div class="product-grid">

      <!-- Card 1 -->
      <div class="product-card">
        <div class="product-image">
          <div class="img-corner tl"></div><div class="img-corner tr"></div>
          <div class="img-corner bl"></div><div class="img-corner br"></div>
          <img src="imagenes/candela (2).png" alt="Candela 1" />
        </div>
        <div class="product-info">
          <p class="product-name">candela uva</p>
          <p class="product-price">2mil</p>
          <p class="product-description">Aromática, hecha con cera ecológica.</p>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="product-card">
        <div class="product-image">
          <div class="img-corner tl"></div><div class="img-corner tr"></div>
          <div class="img-corner bl"></div><div class="img-corner br"></div>
          <img src="imagenes/vela roja.png" alt="Candela 2" />
        </div>
        <div class="product-info">
          <p class="product-name"> candela roja</p>
          <p class="product-price">2mil</p>
          <p class="product-description">Relajante y duradera para una atmósfera serena.</p>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="product-card">
        <div class="product-image">
          <div class="img-corner tl"></div><div class="img-corner tr"></div>
          <div class="img-corner bl"></div><div class="img-corner br"></div>
          <img src="imagenes/candela.png" alt="Candela 3" />
        </div>
        <div class="product-info">
          <p class="product-name"> candela naranja</p>
          <p class="product-price">2mil</p>
          <p class="product-description">Diseño natural con aroma suave y limpio.</p>
        </div>
      </div>

    </div>
  </div>

  <script>
    function setActive(btn) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>

</body>
</html>
