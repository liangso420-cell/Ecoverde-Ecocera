<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecocera — Catálogo</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="productos.css">
</head>
<body>

  <div class="leaf-border left"></div>
  <div class="leaf-border right"></div>

  <div class="page-wrapper">

    <nav>
      <div class="logo-circle">
        <img src="imagenes/logo2.png" alt="Ecocera logo" />
      </div>
      <ul>
        <li><a href="index.html">Ecocera</a></li>
        <li class="active"><a href="productos.html">Catálogo</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>

    <div class="product-grid">

      <!-- Card 1 -->
      <div class="product-card">
        <div class="product-image">
          <div class="img-corner tl"></div><div class="img-corner tr"></div>
          <div class="img-corner bl"></div><div class="img-corner br"></div>
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="6" width="36" height="36" rx="2" stroke="#5a7a4a" stroke-width="1.5"/>
            <path d="M6 6 L42 42M6 42 L42 6" stroke="#5a7a4a" stroke-width="1.5"/>
            <circle cx="24" cy="24" r="6" stroke="#5a7a4a" stroke-width="1.2" fill="none"/>
          </svg>
        </div>
        <div class="product-info">
          <p class="product-name">Texto</p>
          <p class="product-price">$0</p>
          <p class="product-description"></p>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="product-card">
        <div class="product-image">
          <div class="img-corner tl"></div><div class="img-corner tr"></div>
          <div class="img-corner bl"></div><div class="img-corner br"></div>
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="6" width="36" height="36" rx="2" stroke="#5a7a4a" stroke-width="1.5"/>
            <path d="M6 6 L42 42M6 42 L42 6" stroke="#5a7a4a" stroke-width="1.5"/>
            <circle cx="24" cy="24" r="6" stroke="#5a7a4a" stroke-width="1.2" fill="none"/>
          </svg>
        </div>
        <div class="product-info">
          <p class="product-name">Texto</p>
          <p class="product-price">$0</p>
          <p class="product-description"></p>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="product-card">
        <div class="product-image">
          <div class="img-corner tl"></div><div class="img-corner tr"></div>
          <div class="img-corner bl"></div><div class="img-corner br"></div>
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="6" width="36" height="36" rx="2" stroke="#5a7a4a" stroke-width="1.5"/>
            <path d="M6 6 L42 42M6 42 L42 6" stroke="#5a7a4a" stroke-width="1.5"/>
            <circle cx="24" cy="24" r="6" stroke="#5a7a4a" stroke-width="1.2" fill="none"/>
          </svg>
        </div>
        <div class="product-info">
          <p class="product-name">Texto</p>
          <p class="product-price">$0</p>
          <p class="product-description"></p>
        </div>
      </div>

    </div>
  </div>

  <script>
    function setActive(btn) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>

</body>
</html>
