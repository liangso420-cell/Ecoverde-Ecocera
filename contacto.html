<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ecocera — Contacto</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    :root {
      --verde-oscuro: #4a7235;
      --verde-medio: #6b9e50;
      --verde-claro: #8dc46a;
      --crema: #f8f5ef;
      --crema-oscuro: #ede8de;
      --texto: #2c3e20;
      --texto-suave: #5a6e4a;
    }
 
    body {
      font-family: 'Raleway', sans-serif;
      background-color: var(--crema);
      color: var(--texto);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }
 
    /* ── HOJAS LATERALES ── */
    .hojas-lateral {
      position: fixed;
      top: 0;
      width: 180px;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      opacity: 0.85;
    }
    .hojas-izquierda { left: 0; }
    .hojas-derecha   { right: 0; }
    .svg-hojas { width: 100%; height: 100%; }
 
    /* ── ENCABEZADO ── */
    header {
      width: 100%;
      text-align: center;
      padding: 2.5rem 1rem 1rem;
      position: relative;
      z-index: 10;
    }
    .marca {
      font-family: 'Cinzel', serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 500;
      letter-spacing: 0.18em;
      color: var(--verde-oscuro);
      text-transform: uppercase;
    }
    .nav-links {
      margin-top: 0.8rem;
      display: flex;
      gap: 2rem;
      justify-content: center;
      list-style: none;
    }
    .nav-links a {
      font-family: 'Raleway', sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--texto-suave);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover,
    .nav-links a.activo { color: var(--verde-oscuro); }
 
    /* ── SEPARADOR ── */
    .divisor {
      width: 60px;
      height: 1.5px;
      background: var(--verde-medio);
      margin: 0.5rem auto 0;
      opacity: 0.6;
    }
 
    /* ── PRINCIPAL ── */
    main {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 640px;
      padding: 2rem 1.5rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.6rem;
    }
 
    /* ── TARJETA DESCRIPCIÓN ── */
    .tarjeta-descripcion {
      text-align: center;
    }
    .titulo-contacto {
      font-family: 'Cinzel', serif;
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      color: var(--verde-oscuro);
      margin-bottom: 0.8rem;
    }
    .texto-descripcion {
      font-size: 0.88rem;
      font-weight: 300;
      line-height: 1.85;
      letter-spacing: 0.04em;
      color: var(--texto-suave);
    }
 
    /* ── TARJETA FORMULARIO ── */
    .tarjeta-formulario {
      width: 100%;
      background: #fff;
      border: 1px solid rgba(106,158,80,0.25);
      border-radius: 12px;
      padding: 2rem 2rem 1.8rem;
      box-shadow: 0 4px 24px rgba(74,114,53,0.08);
    }
 
    .fila-doble {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
      margin-bottom: 1.2rem;
    }
 
    .campo { display: flex; flex-direction: column; gap: 0.4rem; }
    .campo-mensaje { margin-top: 0.2rem; }
 
    .etiqueta {
      font-family: 'Raleway', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--texto-suave);
      font-weight: 500;
    }
 
    .entrada {
      font-family: 'Raleway', sans-serif;
      font-size: 0.88rem;
      font-weight: 300;
      color: var(--texto);
      background: transparent;
      border: none;
      border-bottom: 1.5px solid rgba(74,114,53,0.35);
      padding: 0.5rem 0.1rem;
      outline: none;
      transition: border-color 0.25s;
      width: 100%;
    }
    .entrada:focus { border-color: var(--verde-medio); }
    .entrada.error { border-color: #c0392b; }
 
    .entrada-mensaje { width: 100%; }
 
    /* ── MENSAJE DE ERROR ── */
    .msg-error {
      font-size: 0.7rem;
      color: #c0392b;
      letter-spacing: 0.05em;
      min-height: 14px;
    }
 
    /* ── BOTÓN ENVIAR ── */
    .boton-enviar {
      font-family: 'Raleway', sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 500;
      color: #fff;
      background: var(--verde-medio);
      border: none;
      border-radius: 30px;
      padding: 0.75rem 2.6rem;
      cursor: pointer;
      transition: background 0.25s, transform 0.15s;
      margin-top: 0.4rem;
      align-self: center;
    }
    .boton-enviar:hover  { background: var(--verde-oscuro); }
    .boton-enviar:active { transform: scale(0.97); }
    .boton-enviar:disabled {
      background: #b0c8a0;
      cursor: not-allowed;
      transform: none;
    }
 
    /* ── FOOTER ── */
    footer {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 640px;
      padding: 1.5rem 1rem 2.5rem;
      text-align: center;
    }
    .titulo-redes {
      font-family: 'Cinzel', serif;
      font-size: 0.88rem;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--verde-oscuro);
      margin-bottom: 1.2rem;
    }
    .redes { display: flex; gap: 2rem; justify-content: center; }
    .red-enlace {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.45rem;
      text-decoration: none;
      transition: transform 0.2s;
    }
    .red-enlace:hover { transform: translateY(-3px); }
    .logo-red { width: 38px; height: 38px; border-radius: 9px; }
    .nombre-red {
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      color: var(--texto-suave);
    }
 
    /* ── NOTIFICACIÓN ── */
    #notificacion {
      display: none;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--verde-medio);
      color: #fff;
      padding: 14px 32px;
      border-radius: 30px;
      font-family: 'Raleway', sans-serif;
      font-size: 0.88rem;
      font-weight: 400;
      letter-spacing: 0.05em;
      box-shadow: 0 4px 18px rgba(90,122,66,0.35);
      z-index: 999;
      transition: opacity 0.4s ease;
    }
    #notificacion.error-notif { background: #c0392b; }
 
    /* ── RESPONSIVE ── */
    @media (max-width: 560px) {
      .hojas-lateral { width: 100px; }
      .fila-doble { grid-template-columns: 1fr; }
      .tarjeta-formulario { padding: 1.5rem 1.2rem; }
    }
  </style>
</head>

      <p class="texto-descripcion">

    <!-- Formulario -->

        <div class="fila-doble">

            <label class="etiqueta" for="nombre">Nombre</label>
            <input class="entrada" type="text" id="nombre" name="nombre" autocomplete="off" />

          <div class="campo">

 <script>
  // ═══════════════════════════════════
  // CONFIGURACIÓN EMAILJS
  // ═══════════════════════════════════

  const EMAILJS_PUBLIC_KEY = '3niYKOmiouE_hk2u_';
  const EMAILJS_SERVICE_ID = 'service_x9qe9qy';
  const EMAILJS_TEMPLATE_ID = 'template_n7nrhhj';

  emailjs.init({
    publicKey: EMAILJS_PUBLIC_KEY
  });

  // ── Notificación flotante ──
  function mostrarNotificacion(texto, esError = false) {
    const notif = document.getElementById('notificacion');

    notif.textContent = texto;
    notif.className = esError ? 'error-notif' : '';

    notif.style.display = 'block';
    notif.style.opacity = '1';

    setTimeout(() => {
      notif.style.opacity = '0';

      setTimeout(() => {
        notif.style.display = 'none';
      }, 400);

    }, 3500);
  }

  // ── Validación ──
  function validarCampo(id, errorId, validar) {
    const campo = document.getElementById(id);
    const error = document.getElementById(errorId);

    const valido = validar(campo.value.trim());

    if (!valido.ok) {
      campo.classList.add('error');
      error.textContent = valido.msg;
    } else {
      campo.classList.remove('error');
      error.textContent = '';
    }

    return valido.ok;
  }

  function esEmailValido(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }

  // ── Evento enviar ──
  document.getElementById('btn-enviar')
    .addEventListener('click', function () {

      const btn = this;

      const okNombre = validarCampo(
        'nombre',
        'error-nombre',
        v => v.length >= 2
          ? { ok: true }
          : { ok: false, msg: 'Ingresa tu nombre.' }
      );

      const okCorreo = validarCampo(
        'correo',
        'error-correo',
        v => esEmailValido(v)
          ? { ok: true }
          : { ok: false, msg: 'Correo inválido.' }
      );

      const okMensaje = validarCampo(
        'mensaje',
        'error-mensaje',
        v => v.length >= 5
          ? { ok: true }
          : { ok: false, msg: 'Escribe un mensaje.' }
      );

      if (!okNombre || !okCorreo || !okMensaje) return;

      btn.disabled = true;
      btn.textContent = 'Enviando...';

      const templateParams = {
        nombre: document.getElementById('nombre').value.trim(),
        correo: document.getElementById('correo').value.trim(),
        mensaje: document.getElementById('mensaje').value.trim(),
      };

      emailjs.send(
        EMAILJS_SERVICE_ID,
        EMAILJS_TEMPLATE_ID,
        templateParams
      )
      .then((response) => {
        console.log('SUCCESS!', response);

        mostrarNotificacion('¡Mensaje enviado con éxito!');

        document.getElementById('formulario').reset();

        ['nombre', 'correo', 'mensaje'].forEach(id => {
          document.getElementById(id)
            .classList.remove('error');
        });

        ['error-nombre', 'error-correo', 'error-mensaje']
          .forEach(id => {
            document.getElementById(id).textContent = '';
          });
      })
      .catch((error) => {
        console.error('ERROR COMPLETO:', error);
        console.log('Status:', error.status);
        console.log('Text:', error.text);

        mostrarNotificacion(
          'Hubo un error al enviar.',
          true
        );
      })
      .finally(() => {
        btn.disabled = false;
        btn.textContent = 'Enviar Mensaje';
      });
    });

  // ── Quitar error mientras escribe ──
  ['nombre', 'correo', 'mensaje'].forEach(id => {

    document.getElementById(id)
      .addEventListener('input', function () {

        this.classList.remove('error');

        document.getElementById(
          'error-' + id
        ).textContent = '';
      });
  });
</script>
