<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ecocera — Contacto</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Raleway', sans-serif;
      background-color: var(--crema);
      color: var(--texto);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* ── PRINCIPAL ── */
    main {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 640px;
      padding: 2rem 1.5rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.6rem;
    }

    /* ── TARJETA DESCRIPCIÓN ── */
    .tarjeta-descripcion {
      text-align: center;
    }
    .titulo-contacto {
      font-family: 'Cinzel', serif;
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      color: var(--verde-oscuro);
      margin-bottom: 0.8rem;
    }
    .texto-descripcion {
      font-size: 0.88rem;
      font-weight: 300;
      line-height: 1.85;
      letter-spacing: 0.04em;
      color: var(--texto-suave);
    }

    /* ── TARJETA FORMULARIO ── */
    .tarjeta-formulario {
      width: 100%;
      background: #fff;
      border: 1px solid rgba(106,158,80,0.25);
      border-radius: 12px;
      padding: 2rem 2rem 1.8rem;
      box-shadow: 0 4px 24px rgba(74,114,53,0.08);
    }

    .fila-doble {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      margin-bottom: 1.2rem;
      width: 100%;
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      width: 100%;
      max-width: 380px;
      align-items: center;
    }
    .campo-mensaje {
      margin-top: 0.2rem;
      max-width: 380px;
      align-items: center;
    }

    .etiqueta {
      font-family: 'Raleway', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--texto-suave);
      font-weight: 500;
    }

    .entrada {
      font-family: 'Raleway', sans-serif;
      font-size: 0.88rem;
      font-weight: 300;
      color: var(--texto);
      background: transparent;
      border: none;
      border-bottom: 1.5px solid rgba(74,114,53,0.35);
      padding: 0.5rem 0.1rem;
      outline: none;
      transition: border-color 0.25s;
      width: 100%;
      text-align: left;
    }
    .entrada:focus { border-color: var(--verde-medio); }
    .entrada.error { border-color: #c0392b; }

    .entrada-mensaje {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      line-height: 1.6;
      font-family: 'Raleway', sans-serif;
    }

    /* ── MENSAJE DE ERROR ── */
    .msg-error {
      font-size: 0.7rem;
      color: #c0392b;
      letter-spacing: 0.05em;
      min-height: 14px;
    }

    /* ── BOTÓN ENVIAR ── */
    .boton-enviar {
      font-family: 'Raleway', sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 500;
      color: #fff;
      background: var(--verde-medio);
      border: none;
      border-radius: 30px;
      padding: 0.75rem 2.6rem;
      cursor: pointer;
      transition: background 0.25s, transform 0.15s;
      margin-top: 0.4rem;
      align-self: center;
    }
    .boton-enviar:hover  { background: var(--verde-oscuro); }
    .boton-enviar:active { transform: scale(0.97); }
    .boton-enviar:disabled {
      background: #b0c8a0;
      cursor: not-allowed;
      transform: none;
    }

    /* ── FOOTER ── */
    footer {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 640px;
      padding: 1.5rem 1rem 2.5rem;
      text-align: center;
    }
    .titulo-redes {
      font-family: 'Cinzel', serif;
      font-size: 0.88rem;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--verde-oscuro);
      margin-bottom: 1.2rem;
    }
    .redes { display: flex; gap: 2rem; justify-content: center; }
    .red-enlace {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.45rem;
      text-decoration: none;
      transition: transform 0.2s;
    }
    .red-enlace:hover { transform: translateY(-3px); }
    .logo-red { width: 38px; height: 38px; border-radius: 9px; }
    .nombre-red {
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      color: var(--texto-suave);
    }

    /* ── NOTIFICACIÓN ── */
    #notificacion {
      display: none;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--verde-medio);
      color: #fff;
      padding: 14px 32px;
      border-radius: 30px;
      font-family: 'Raleway', sans-serif;
      font-size: 0.88rem;
      font-weight: 400;
      letter-spacing: 0.05em;
      box-shadow: 0 4px 18px rgba(90,122,66,0.35);
      z-index: 999;
      transition: opacity 0.4s ease;
    }
    #notificacion.error-notif { background: #c0392b; }

    /* ── RESPONSIVE ── */
    @media (max-width: 560px) {
      .tarjeta-formulario { padding: 1.5rem 1.2rem; }
      .campo { max-width: 100%; }
      .campo-mensaje { max-width: 100%; }
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO -->
  <header>
    <h1 class="marca">Ecocera</h1>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="productos.html">Catálogo</a></li>
        <li><a href="contacto.html" class="activo">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <!-- PRINCIPAL -->
  <main>

    <!-- Descripción -->
    <div class="tarjeta-descripcion">
      <h2 class="titulo-contacto">Contacto</h2>
      <p class="texto-descripcion">
        Si deseas más información sobre nuestros productos<br>
        ecológicos, puedes comunicarte con Ecocera<br>
        mediante los siguientes datos:
      </p>
    </div>

    <!-- Formulario -->
    <div class="tarjeta-formulario">
      <form id="formulario" novalidate>

        <div class="fila-doble">
          <div class="campo">
            <label class="etiqueta" for="nombre">Nombre</label>
            <input class="entrada" type="text" id="nombre" name="nombre" autocomplete="off" />
            <span class="msg-error" id="error-nombre"></span>
          </div>
          <div class="campo">
            <label class="etiqueta" for="correo">Correo Electrónico</label>
            <input class="entrada" type="email" id="correo" name="correo" autocomplete="off" />
            <span class="msg-error" id="error-correo"></span>
          </div>

        <div class="campo campo-mensaje">
          <label class="etiqueta" for="mensaje">Mensaje</label>
          <textarea class="entrada entrada-mensaje" id="mensaje" name="mensaje" autocomplete="off" rows="5"></textarea>
          <span class="msg-error" id="error-mensaje"></span>
        </div>

      </form>
    </div>

    <button class="boton-enviar" id="btn-enviar" type="button">Enviar Mensaje</button>

  </main>

  <!-- FOOTER -->
  <footer class="pie">
    <h3 class="titulo-redes">Redes Sociales</h3>
    <div class="redes">

      <!-- Instagram -->
      <a href="https://www.instagram.com/Ecocera.cr" target="_blank" rel="noopener noreferrer" class="red-enlace">
        <svg class="logo-red" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="grad-ig" cx="30%" cy="107%" r="130%">
              <stop offset="0%"  stop-color="#ffd600"/>
              <stop offset="20%" stop-color="#ff7a00"/>
              <stop offset="45%" stop-color="#ff0069"/>
              <stop offset="75%" stop-color="#d300c5"/>
              <stop offset="100%" stop-color="#7638fa"/>
            </radialGradient>
          </defs>
          <rect width="48" height="48" rx="11" fill="url(#grad-ig)"/>
          <rect x="12" y="12" width="24" height="24" rx="7" stroke="white" stroke-width="2.2" fill="none"/>
          <circle cx="24" cy="24" r="6" stroke="white" stroke-width="2.2" fill="none"/>
          <circle cx="34" cy="14" r="1.8" fill="white"/>
        </svg>
        <span class="nombre-red">Ecocera.cr</span>
      </a>

    </div>
  </footer>

  <!-- NOTIFICACIÓN -->
  <div id="notificacion"></div>

 <script>
  // ═══════════════════════════════════
  // CONFIGURACIÓN EMAILJS
  // ═══════════════════════════════════

  const EMAILJS_PUBLIC_KEY = '3niYKOmiouE_hk2u_';
  const EMAILJS_SERVICE_ID = 'service_x9qe9qy';
  const EMAILJS_TEMPLATE_ID = 'template_n7nrhhj';

  emailjs.init({
    publicKey: EMAILJS_PUBLIC_KEY
  });

  // ── Notificación flotante ──
  function mostrarNotificacion(texto, esError = false) {
    const notif = document.getElementById('notificacion');

    notif.textContent = texto;
    notif.className = esError ? 'error-notif' : '';

    notif.style.display = 'block';
    notif.style.opacity = '1';

    setTimeout(() => {
      notif.style.opacity = '0';

      setTimeout(() => {
        notif.style.display = 'none';
      }, 400);

    }, 3500);
  }

  // ── Validación ──
  function validarCampo(id, errorId, validar) {
    const campo = document.getElementById(id);
    const error = document.getElementById(errorId);

    const valido = validar(campo.value.trim());

    if (!valido.ok) {
      campo.classList.add('error');
      error.textContent = valido.msg;
    } else {
      campo.classList.remove('error');
      error.textContent = '';
    }

    return valido.ok;
  }

  function esEmailValido(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }

  // ── Evento enviar ──
  document.getElementById('btn-enviar')
    .addEventListener('click', function () {

      const btn = this;

      const okNombre = validarCampo(
        'nombre',
        'error-nombre',
        v => v.length >= 2
          ? { ok: true }
          : { ok: false, msg: 'Ingresa tu nombre.' }
      );

      const okCorreo = validarCampo(
        'correo',
        'error-correo',
        v => esEmailValido(v)
          ? { ok: true }
          : { ok: false, msg: 'Correo inválido.' }
      );

      const okMensaje = validarCampo(
        'mensaje',
        'error-mensaje',
        v => v.length >= 5
          ? { ok: true }
          : { ok: false, msg: 'Escribe un mensaje.' }
      );

      if (!okNombre || !okCorreo || !okMensaje) return;

      btn.disabled = true;
      btn.textContent = 'Enviando...';

      const templateParams = {
        nombre: document.getElementById('nombre').value.trim(),
        correo: document.getElementById('correo').value.trim(),
        mensaje: document.getElementById('mensaje').value.trim(),
      };

      emailjs.send(
        EMAILJS_SERVICE_ID,
        EMAILJS_TEMPLATE_ID,
        templateParams
      )
      .then((response) => {
        console.log('SUCCESS!', response);

        mostrarNotificacion('¡Mensaje enviado con éxito!');

        document.getElementById('formulario').reset();

        ['nombre', 'correo', 'mensaje'].forEach(id => {
          document.getElementById(id)
            .classList.remove('error');
        });

        ['error-nombre', 'error-correo', 'error-mensaje']
          .forEach(id => {
            document.getElementById(id).textContent = '';
          });
      })
      .catch((error) => {
        console.error('ERROR COMPLETO:', error);
        console.log('Status:', error.status);
        console.log('Text:', error.text);

        mostrarNotificacion(
          'Hubo un error al enviar.',
          true
        );
      })
      .finally(() => {
        btn.disabled = false;
        btn.textContent = 'Enviar Mensaje';
      });
    });

  // ── Quitar error mientras escribe ──
  ['nombre', 'correo', 'mensaje'].forEach(id => {

    document.getElementById(id)
      .addEventListener('input', function () {

        this.classList.remove('error');

        document.getElementById(
          'error-' + id
        ).textContent = '';
      });
  });
</script>
  <footer>
    © 2025 Ecocera · Convierte Contaminación En Iluminación
  </footer>
</body>
</html>
